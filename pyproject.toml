[project]
name = "tg-cli"
version = "0.2.0"
description = "CLI wrapper around Telethon (MTProto) for Claude Code skill access to Telegram groups."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oleg Lomaka" }]
dependencies = [
    "telethon>=1.36",
    "click>=8.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
tg = "tg_cli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
